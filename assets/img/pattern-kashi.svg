<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- کاشی فیروزه‌ای هفت‌رنگ: ستارهٔ خاتمِ لاجورد، گلِ چهارپر، ترنج‌های طلایی و اناری -->
  <rect width="180" height="180" fill="#0e7c8a"/>
  <rect width="180" height="180" fill="url(#none)"/>
  <!-- زمینه: سایهٔ نرم فیروزه‌ایِ دو لایه -->
  <circle cx="90" cy="90" r="86" fill="#0a6270" opacity=".55"/>
  <circle cx="90" cy="90" r="60" fill="#128894" opacity=".5"/>
  <!-- شبکهٔ گره‌چینی: پرتوها از ستاره به گل‌ها و ترنج‌ها -->
  <g stroke="#f2ede3" stroke-width="2" opacity=".28">
    <path d="M90 90 90 0M90 90 90 180M90 90 0 90M90 90 180 90"/>
    <path d="M90 90 0 0M90 90 180 0M90 90 0 180M90 90 180 180"/>
  </g>
  <!-- ترنج‌های لبهٔ کاشی (نصف در هر لبه، جفتِ قرینه در لبهٔ روبه‌رو) -->
  <g stroke="#f2ede3" stroke-width="2">
    <rect x="79" y="-11" width="22" height="22" transform="rotate(45 90 0)" fill="#d9a441"/>
    <rect x="79" y="169" width="22" height="22" transform="rotate(45 90 180)" fill="#d9a441"/>
    <rect x="-11" y="79" width="22" height="22" transform="rotate(45 0 90)" fill="#a63a2b"/>
    <rect x="169" y="79" width="22" height="22" transform="rotate(45 180 90)" fill="#a63a2b"/>
  </g>
  <!-- گلِ چهارپر در چهار گوشه (با کاشی‌های همسایه کامل می‌شود) -->
  <g>
    <g fill="#1c4e89" stroke="#f2ede3" stroke-width="2">
      <circle cx="0" cy="0" r="19"/><circle cx="180" cy="0" r="19"/>
      <circle cx="0" cy="180" r="19"/><circle cx="180" cy="180" r="19"/>
    </g>
    <g fill="#d9a441">
      <circle cx="0" cy="0" r="7.5"/><circle cx="180" cy="0" r="7.5"/>
      <circle cx="0" cy="180" r="7.5"/><circle cx="180" cy="180" r="7.5"/>
    </g>
    <g fill="#a63a2b">
      <circle cx="0" cy="0" r="2.6"/><circle cx="180" cy="0" r="2.6"/>
      <circle cx="0" cy="180" r="2.6"/><circle cx="180" cy="180" r="2.6"/>
    </g>
  </g>
  <!-- ستارهٔ خاتمِ میانه: دو مربعِ لاجوردیِ چرخیده -->
  <g stroke="#f2ede3" stroke-width="2.4">
    <rect x="54" y="54" width="72" height="72" fill="#1c4e89"/>
    <rect x="54" y="54" width="72" height="72" fill="#16406f" transform="rotate(45 90 90)" opacity=".96"/>
  </g>
  <!-- گلبرگ‌های سفید پیرامون شمسه -->
  <g fill="#f2ede3" opacity=".92">
    <ellipse cx="90" cy="64" rx="6.5" ry="11"/>
    <ellipse cx="90" cy="64" rx="6.5" ry="11" transform="rotate(45 90 90)"/>
    <ellipse cx="90" cy="64" rx="6.5" ry="11" transform="rotate(90 90 90)"/>
    <ellipse cx="90" cy="64" rx="6.5" ry="11" transform="rotate(135 90 90)"/>
    <ellipse cx="90" cy="64" rx="6.5" ry="11" transform="rotate(180 90 90)"/>
    <ellipse cx="90" cy="64" rx="6.5" ry="11" transform="rotate(225 90 90)"/>
    <ellipse cx="90" cy="64" rx="6.5" ry="11" transform="rotate(270 90 90)"/>
    <ellipse cx="90" cy="64" rx="6.5" ry="11" transform="rotate(315 90 90)"/>
  </g>
  <!-- شمسهٔ طلایی و دلِ اناری -->
  <circle cx="90" cy="90" r="16.5" fill="#d9a441" stroke="#f2ede3" stroke-width="2"/>
  <circle cx="90" cy="90" r="6" fill="#a63a2b"/>
  <!-- مهره‌های فیروزه‌ای میانِ نقش‌ها -->
  <g fill="#7fd4c4">
    <circle cx="45" cy="45" r="4"/><circle cx="135" cy="45" r="4"/>
    <circle cx="45" cy="135" r="4"/><circle cx="135" cy="135" r="4"/>
  </g>
</svg>
